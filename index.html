<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>باقة ورد</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg1:#16081f;
      --bg2:#2b1039;
      --bg3:#07020b;
      --gold:#ffd76a;
      --green1:#5ad47b;
      --green2:#1d7c43;
      --paper1:#ffe9ef;
      --paper2:#f5c8d4;
      --paper3:#dc9caf;
      --rose1:#ffd9e7;
      --rose2:#ff93bf;
      --rose3:#ea4f8c;
      --rose4:#c92b67;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:"Tahoma", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,110,170,0.14), transparent 22%),
        radial-gradient(circle at 80% 15%, rgba(162,110,255,0.12), transparent 18%),
        radial-gradient(circle at 50% 0%, rgba(255,210,120,0.08), transparent 24%),
        radial-gradient(circle at center, var(--bg2) 0%, #13071d 55%, var(--bg3) 100%);
    }

    .scene{
      position:relative;
      width:min(92vw, 920px);
      aspect-ratio:1 / 1;
      overflow:hidden;
      border-radius:34px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      box-shadow:0 30px 80px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .ambient-light{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 33%, rgba(255,145,190,0.18), transparent 16%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(255,215,106,0.04), transparent 20%);
      filter:blur(10px);
    }

    .sparkles{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .sparkle{
      position:absolute;
      width:4px;
      height:4px;
      border-radius:50%;
      background:rgba(255,255,255,0.7);
      box-shadow:0 0 10px rgba(255,255,255,0.6);
      animation:twinkle 2.8s ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{opacity:0.12;transform:scale(0.7);}
      50%{opacity:1;transform:scale(1.5);}
    }

    .bouquet-area{
      position:absolute;
      left:50%;
      top:54%;
      width:min(60vw, 560px);
      height:min(78vw, 740px);
      transform:translate(-50%, -50%);
      animation:floaty 5s ease-in-out infinite;
    }

    @keyframes floaty{
      0%,100%{transform:translate(-50%, -50%) translateY(0);}
      50%{transform:translate(-50%, -50%) translateY(-10px);}
    }

    .glow{
      position:absolute;
      width:380px;
      height:380px;
      left:50%;
      top:0;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,110,170,0.24), transparent 72%);
      filter:blur(28px);
      pointer-events:none;
    }

    .wrap-back-left,
    .wrap-back-right,
    .wrap-front-left,
    .wrap-front-right{
      position:absolute;
      border-radius:18px;
      box-shadow:0 24px 36px rgba(0,0,0,0.22);
    }

    .wrap-back-left{
      left:58px;
      bottom:112px;
      width:224px;
      height:332px;
      background:linear-gradient(180deg, var(--paper1), var(--paper3));
      clip-path:polygon(0 18%, 100% 0, 72% 100%, 0 100%);
      transform:rotate(-13deg);
      opacity:0.94;
      z-index:0;
    }

    .wrap-back-right{
      right:58px;
      bottom:112px;
      width:224px;
      height:332px;
      background:linear-gradient(180deg, #fff4f7, #e4adb9);
      clip-path:polygon(0 0, 100% 18%, 100% 100%, 28% 100%);
      transform:rotate(13deg);
      opacity:0.94;
      z-index:0;
    }

    .wrap-front-left{
      left:104px;
      bottom:84px;
      width:158px;
      height:278px;
      background:linear-gradient(180deg, rgba(255,255,255,0.44), rgba(241,191,206,0.92));
      clip-path:polygon(0 10%, 100% 0, 70% 100%, 0 100%);
      transform:rotate(-8deg);
      z-index:5;
      backdrop-filter:blur(3px);
      border:1px solid rgba(255,255,255,0.24);
    }

    .wrap-front-right{
      right:104px;
      bottom:84px;
      width:158px;
      height:278px;
      background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(233,177,193,0.9));
      clip-path:polygon(0 0, 100% 10%, 100% 100%, 30% 100%);
      transform:rotate(8deg);
      z-index:5;
      backdrop-filter:blur(3px);
      border:1px solid rgba(255,255,255,0.22);
    }

    .mesh{
      position:absolute;
      left:50%;
      bottom:116px;
      transform:translateX(-50%);
      width:250px;
      height:260px;
      z-index:4;
      opacity:0.28;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.55) 0 2px, transparent 2px 14px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.4) 0 2px, transparent 2px 14px);
      clip-path:polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      filter:blur(0.2px);
    }

    .stems{
      position:absolute;
      left:50%;
      top:205px;
      width:360px;
      height:400px;
      transform:translateX(-50%);
      z-index:1;
    }

    .stem{
      position:absolute;
      width:12px;
      border-radius:30px;
      background:linear-gradient(180deg, var(--green1), var(--green2));
      box-shadow:inset -2px 0 4px rgba(0,0,0,0.15), 0 0 8px rgba(35,120,70,0.08);
      transform-origin:top center;
    }

    .leaf{
      position:absolute;
      width:82px;
      height:36px;
      background:linear-gradient(135deg, #72ec95, #25994f);
      border-radius:0 100% 0 100%;
      filter:drop-shadow(0 4px 5px rgba(0,0,0,0.15));
    }

    .leaf::before{
      content:"";
      position:absolute;
      width:2px;
      height:72%;
      left:49%;
      top:13%;
      background:rgba(255,255,255,0.34);
      transform:rotate(25deg);
    }

    .leaf::after{
      content:"";
      position:absolute;
      inset:6px;
      border-radius:inherit;
      border:1px solid rgba(255,255,255,0.08);
    }

    .flower{
      position:absolute;
      width:132px;
      height:132px;
      filter:drop-shadow(0 18px 18px rgba(0,0,0,0.24));
      z-index:3;
      animation:bloom 5s ease-in-out infinite;
      transition:transform 0.35s ease, filter 0.35s ease;
    }

    .flower.small{width:116px;height:116px;}
    .flower.tiny{width:102px;height:102px;}

    @keyframes bloom{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.035);}
    }

    .flower:hover{
      filter:drop-shadow(0 22px 24px rgba(0,0,0,0.28));
    }

    .flower.pop{
      transform:scale(1.16) rotate(8deg) !important;
    }

    .petal{
      position:absolute;
      width:60px;
      height:84px;
      left:36px;
      top:4px;
      border-radius:55% 55% 42% 42%;
      transform-origin:center 60px;
      box-shadow:
        inset 8px 8px 10px rgba(255,255,255,0.18),
        inset -8px -8px 10px rgba(0,0,0,0.10),
        0 2px 8px rgba(0,0,0,0.08);
    }

    .petal::after{
      content:"";
      position:absolute;
      left:50%;
      top:10px;
      transform:translateX(-50%);
      width:2px;
      height:52px;
      border-radius:2px;
      background:rgba(255,255,255,0.18);
    }

    .inner-petal{
      position:absolute;
      width:42px;
      height:60px;
      left:45px;
      top:25px;
      border-radius:55% 55% 42% 42%;
      transform-origin:center 44px;
      opacity:0.96;
      z-index:2;
      filter:brightness(1.06);
      box-shadow:inset 4px 4px 8px rgba(255,255,255,0.18);
    }

    .i1{transform:rotate(20deg) translateY(-4px);}
    .i2{transform:rotate(140deg) translateY(-4px);}
    .i3{transform:rotate(260deg) translateY(-4px);}

    .p1{transform:rotate(0deg) translateY(-8px);}
    .p2{transform:rotate(45deg) translateY(-8px);}
    .p3{transform:rotate(90deg) translateY(-8px);}
    .p4{transform:rotate(135deg) translateY(-8px);}
    .p5{transform:rotate(180deg) translateY(-8px);}
    .p6{transform:rotate(225deg) translateY(-8px);}
    .p7{transform:rotate(270deg) translateY(-8px);}
    .p8{transform:rotate(315deg) translateY(-8px);}

    .pink .petal, .pink .inner-petal{
      background:linear-gradient(180deg, #ffe1ec 0%, #ff9ec4 55%, #ef4f8d 100%);
    }

    .red .petal, .red .inner-petal{
      background:linear-gradient(180deg, #ffd0d5 0%, #ff7286 55%, #d63055 100%);
    }

    .white .petal, .white .inner-petal{
      background:linear-gradient(180deg, #ffffff 0%, #f4eef6 60%, #d8ced9 100%);
    }

    .purple .petal, .purple .inner-petal{
      background:linear-gradient(180deg, #eddcff 0%, #c095ff 58%, #9059ef 100%);
    }

    .peach .petal, .peach .inner-petal{
      background:linear-gradient(180deg, #ffe3d6 0%, #ffae8a 58%, #f4724d 100%);
    }

    .center{
      position:absolute;
      width:34px;
      height:34px;
      left:49px;
      top:49px;
      border-radius:50%;
      z-index:4;
      background:radial-gradient(circle at 30% 30%, #fff7bc, #f7c74c 66%, #cd8918 100%);
      box-shadow:0 0 16px rgba(255,190,60,0.4), inset 0 0 4px rgba(255,255,255,0.45);
    }

    .center::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:2px dotted rgba(120,80,0,0.28);
    }

    .ribbon{
      position:absolute;
      left:50%;
      bottom:118px;
      width:130px;
      height:34px;
      transform:translateX(-50%);
      border-radius:30px;
      background:linear-gradient(90deg, #ff89bb, #ff3d86);
      box-shadow:0 0 24px rgba(255,70,140,0.38), inset 0 2px 4px rgba(255,255,255,0.24);
      z-index:8;
    }

    .ribbon::before,
    .ribbon::after{
      content:"";
      position:absolute;
      top:7px;
      width:54px;
      height:54px;
      background:linear-gradient(135deg, #ff94c0, #ff438a);
      border-radius:14px 44px 14px 44px;
      z-index:-1;
      box-shadow:inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .ribbon::before{
      left:-26px;
      transform:rotate(36deg);
    }

    .ribbon::after{
      right:-26px;
      transform:scaleX(-1) rotate(36deg);
    }

    .ribbon-knot{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:24px;
      height:24px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #ffd0e2, #ff3d86 75%);
      box-shadow:inset 0 2px 5px rgba(255,255,255,0.2);
    }

    .tail{
      position:absolute;
      width:18px;
      height:112px;
      background:linear-gradient(180deg, #ff79af, #ff438a);
      bottom:-98px;
      border-radius:10px;
      box-shadow:inset 0 2px 4px rgba(255,255,255,0.15);
    }

    .tail.left{
      left:34px;
      transform:rotate(10deg);
      clip-path:polygon(0 0, 100% 0, 85% 78%, 50% 100%, 15% 78%);
    }

    .tail.right{
      right:34px;
      transform:rotate(-10deg);
      clip-path:polygon(0 0, 100% 0, 85% 78%, 50% 100%, 15% 78%);
    }

    .main-title{
      position:absolute;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      color:white;
      background:linear-gradient(135deg, #ff8ab5, #ff4f8d, #ffd76a);
      background-size:200% 200%;
      padding:12px 28px;
      border-radius:30px;
      font-size:clamp(24px, 3vw, 36px);
      font-weight:bold;
      letter-spacing:1px;
      z-index:20;
      box-shadow:0 0 20px rgba(255,120,170,0.5), inset 0 0 10px rgba(255,255,255,0.2);
      animation:titleGlow 6s ease infinite, titleFloat 3s ease-in-out infinite;
    }

    @keyframes titleGlow{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    @keyframes titleFloat{
      0%,100%{transform:translateX(-50%) translateY(0);}
      50%{transform:translateX(-50%) translateY(-6px);}
    }

    .starName{
      text-shadow:
        0 0 10px #fff,
        0 0 20px #ffd76a,
        0 0 30px #ff7ab3,
        0 0 40px #ff4f8d;
      animation:starGlow 2s infinite alternate;
    }

    @keyframes starGlow{
      from{ text-shadow:0 0 5px #fff, 0 0 10px #ffd76a, 0 0 15px #ff7ab3; }
      to{ text-shadow:0 0 15px #fff, 0 0 25px #ffd76a, 0 0 35px #ff4f8d; }
    }

    .falling-petal{
      position:absolute;
      top:-60px;
      width:18px;
      height:28px;
      border-radius:50% 50% 45% 45%;
      opacity:0.9;
      pointer-events:none;
      animation-name:fall, sway, spin;
      animation-timing-function:linear, ease-in-out, linear;
      animation-iteration-count:infinite, infinite, infinite;
      filter:blur(0.2px) drop-shadow(0 0 6px rgba(255,255,255,0.12));
    }

    @keyframes fall{
      from{transform:translateY(-80px);}
      to{transform:translateY(1100px);}
    }

    @keyframes sway{
      0%,100%{margin-left:0;}
      25%{margin-left:18px;}
      50%{margin-left:-20px;}
      75%{margin-left:14px;}
    }

    @keyframes spin{
      from{rotate:0deg;}
      to{rotate:360deg;}
    }

    .base-shadow{
      position:absolute;
      left:50%;
      bottom:78px;
      transform:translateX(-50%);
      width:340px;
      height:46px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(0,0,0,0.34), transparent 70%);
      filter:blur(14px);
      z-index:0;
    }

    .controls{
      position:absolute;
      top:82px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:14px;
      z-index:30;
      flex-wrap:wrap;
      justify-content:center;
    }

    .loveBtn,
    .heartBtn{
      position:static;
      transform:none;
      min-width:160px;
      padding:12px 24px;
      border:none;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
      color:white;
      z-index:30;
      transition:transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
    }

    .loveBtn:hover,
    .heartBtn:hover{
      transform:translateY(-2px) scale(1.04);
    }

    .loveBtn{
      background:linear-gradient(45deg, #ff5fa2, #ff8ecb);
      box-shadow:0 0 20px rgba(255,100,160,0.6);
    }

    .heartBtn{
      background:linear-gradient(45deg, #ff4f8d, #ff9ac5);
      box-shadow:0 0 20px rgba(255,100,160,0.7);
    }

    @media (max-width: 560px){
      .controls{
        top:78px;
        width:92%;
        gap:10px;
      }

      .loveBtn,
      .heartBtn{
        width:100%;
        min-width:0;
        font-size:17px;
      }
    }

    .loveMessage{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .msgBox{
      background:white;
      padding:30px;
      border-radius:24px;
      text-align:center;
      max-width:400px;
      width:90%;
      font-family:Tahoma, sans-serif;
      line-height:1.9;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .message-title{
      color:#ff3d86;
      font-size:28px;
      font-weight:bold;
      margin-bottom:16px;
    }

    .msgBox p{
      color:#333;
      font-size:18px;
    }

    .msgBox button{
      margin-top:15px;
      padding:8px 18px;
      border:none;
      border-radius:20px;
      background:#ff3d86;
      color:white;
      cursor:pointer;
    }

    .heart,
    .flyingHeart{
      position:fixed;
      pointer-events:none;
      z-index:1200;
      will-change:transform, opacity;
      filter:drop-shadow(0 0 10px rgba(255,255,255,0.25));
    }

    @keyframes burstHeart{
      0%{
        transform:translate(0, 0) scale(0.35) rotate(0deg);
        opacity:0;
      }
      12%{
        transform:translate(calc(var(--dx) * 0.12), calc(var(--dy) * 0.12)) scale(1.05) rotate(calc(var(--rot) * 0.2));
        opacity:1;
      }
      55%{
        transform:translate(calc(var(--dx) * 0.7), calc(var(--dy) * 0.7)) scale(1.18) rotate(calc(var(--rot) * 0.75));
        opacity:0.95;
      }
      100%{
        transform:translate(var(--dx), var(--dy)) scale(0.75) rotate(var(--rot));
        opacity:0;
      }
    }

    @keyframes floatHeart{
      0%{
        transform:translate(0, 0) scale(0.7) rotate(0deg);
        opacity:0;
      }
      12%{
        transform:translate(calc(var(--dx) * 0.12), calc(var(--dy) * 0.14)) scale(1) rotate(calc(var(--rot) * 0.2));
        opacity:1;
      }
      28%{
        transform:translate(calc(var(--dx) * 0.26), calc(var(--dy) * 0.3)) scale(1.08) rotate(calc(var(--rot) * 0.45));
        opacity:0.95;
      }
      46%{
        transform:translate(calc(var(--dx) * 0.44), calc(var(--dy) * 0.5)) scale(0.96) rotate(calc(var(--rot) * 0.6));
        opacity:0.88;
      }
      68%{
        transform:translate(calc(var(--dx) * 0.7), calc(var(--dy) * 0.76)) scale(1.12) rotate(calc(var(--rot) * 0.82));
        opacity:0.82;
      }
      100%{
        transform:translate(var(--dx), var(--dy)) scale(0.82) rotate(var(--rot));
        opacity:0;
      }
    }
      100%{transform:translateY(-900px) scale(1.8);opacity:0;}
    }

    @media (max-width: 768px){
      .bouquet-area{ width:520px; height:700px; }
    }

    @media (max-width: 560px){
      .scene{ width:100vw; height:100vh; aspect-ratio:auto; border-radius:0; }
      .bouquet-area{ transform:translate(-50%, -50%) scale(0.82); }
      @keyframes floaty{
        0%,100%{transform:translate(-50%, -50%) scale(0.82) translateY(0);}
        50%{transform:translate(-50%, -50%) scale(0.82) translateY(-10px);}
      }
    }
  </style>
</head>
<body>

  <div class="main-title starName">🫶🏻خسل</div>

  <div class="controls">
    <button class="loveBtn" onclick="openMessage()">💌 رسالة لك</button>
    <button class="heartBtn" onclick="explodeHearts()">اضغطي هنا 💖</button>
  </div>

  <div class="scene" id="scene">
    <div class="ambient-light"></div>
    <div class="sparkles" id="sparkles"></div>

    <div class="bouquet-area">
      <div class="base-shadow"></div>
      <div class="glow"></div>

      <div class="wrap-back-left"></div>
      <div class="wrap-back-right"></div>
      <div class="mesh"></div>

      <div class="stems">
        <div class="stem" style="height:320px; left:46px; top:0; transform:rotate(21deg);"></div>
        <div class="stem" style="height:305px; left:86px; top:10px; transform:rotate(13deg);"></div>
        <div class="stem" style="height:294px; left:126px; top:14px; transform:rotate(6deg);"></div>
        <div class="stem" style="height:286px; left:168px; top:18px; transform:rotate(0deg);"></div>
        <div class="stem" style="height:294px; left:210px; top:14px; transform:rotate(-6deg);"></div>
        <div class="stem" style="height:305px; left:250px; top:10px; transform:rotate(-13deg);"></div>
        <div class="stem" style="height:320px; left:290px; top:0; transform:rotate(-21deg);"></div>
        <div class="stem" style="height:264px; left:103px; top:60px; transform:rotate(8deg);"></div>
        <div class="stem" style="height:264px; left:233px; top:60px; transform:rotate(-8deg);"></div>

        <div class="leaf" style="left:24px; top:130px; transform:rotate(-26deg);"></div>
        <div class="leaf" style="left:252px; top:138px; transform:scaleX(-1) rotate(-20deg);"></div>
        <div class="leaf" style="left:70px; top:220px; transform:rotate(-10deg) scale(.96);"></div>
        <div class="leaf" style="left:206px; top:232px; transform:scaleX(-1) rotate(-14deg) scale(.94);"></div>
        <div class="leaf" style="left:128px; top:298px; transform:rotate(10deg) scale(.9);"></div>
        <div class="leaf" style="left:176px; top:178px; transform:scaleX(-1) rotate(18deg) scale(.8);"></div>
      </div>

      <div class="flower pink" style="left:206px; top:6px;">
        <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>
        <div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div>
        <div class="inner-petal i1"></div><div class="inner-petal i2"></div><div class="inner-petal i3"></div>
        <div class="center"></div>
      </div>

      <div class="flower red" style="left:108px; top:54px; transform:scale(1.02);">

  <div class="loveMessage" id="loveMessage">
    <div class="msgBox">
      <div class="message-title">🌹 خ س ل 🌹</div>
      <p>
        هذه الباقة لك 🌹<br>
        لأنك أجمل من كل الورد<br>
        وأغلى من كل شيء في الدنيا<br>
        أتمنى لك السعادة دائما ✨
      </p>
      <button onclick="closeMessage()">إغلاق</button>
    </div>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const sparkles = document.getElementById("sparkles");

    const petalColors = [
      ["#ffb7cf", "#ff7daa"],
      ["#ffffff", "#e9e0ea"],
      ["#d7b7ff", "#a673ff"],
      ["#ffb29f", "#ff8a68"],
      ["#ff8ca1", "#ff5976"]
    ];

    function createFallingPetal(){
      const petal = document.createElement("div");
      petal.className = "falling-petal";

      const colorPair = petalColors[Math.floor(Math.random() * petalColors.length)];
      const left = Math.random() * scene.clientWidth;
      const size = 10 + Math.random() * 16;
      const fallDuration = 8 + Math.random() * 7;
      const swayDuration = 2.6 + Math.random() * 2.8;
      const spinDuration = 4 + Math.random() * 5;
      const delay = Math.random() * 4;

      petal.style.left = left + "px";
      petal.style.width = size + "px";
      petal.style.height = size * 1.45 + "px";
      petal.style.background = `linear-gradient(180deg, ${colorPair[0]}, ${colorPair[1]})`;
      petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s, ${spinDuration}s`;
      petal.style.animationDelay = `${delay}s, ${delay}s, ${delay}s`;
      petal.style.opacity = 0.55 + Math.random() * 0.35;

      scene.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, (fallDuration + delay) * 1000);
    }

    function createSparkles(count = 18){
      for(let i = 0; i < count; i++){
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 65 + "%";
        s.style.animationDelay = Math.random() * 3 + "s";
        s.style.animationDuration = (2 + Math.random() * 2.5) + "s";
        s.style.opacity = 0.2 + Math.random() * 0.7;
        sparkles.appendChild(s);
      }
    }

    function openMessage(){
      document.getElementById("loveMessage").style.display = "flex";
    }

    function closeMessage(){
      document.getElementById("loveMessage").style.display = "none";
    }

    function explodeHearts(){
      const symbols = ["🫶🏻", "💖", "💗", "💘", "💕", "💞"];
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight * 0.72;

      for(let i = 0; i < 42; i++){
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 * i) / 42 + (Math.random() * 0.5);
        const radius = 80 + Math.random() * 220;
        const driftX = Math.cos(angle) * radius;
        const driftY = -(120 + Math.random() * 280);
        const rotate = -35 + Math.random() * 70;
        const duration = 2600 + Math.random() * 1800;
        const size = 20 + Math.random() * 28;

        heart.style.left = centerX + (Math.random() * 40 - 20) + "px";
        heart.style.top = centerY + (Math.random() * 30 - 15) + "px";
        heart.style.fontSize = size + "px";
        heart.style.setProperty("--dx", driftX + "px");
        heart.style.setProperty("--dy", driftY + "px");
        heart.style.setProperty("--rot", rotate + "deg");
        heart.style.animation = `burstHeart ${duration}ms cubic-bezier(.18,.72,.22,1) forwards`;

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duration);
      }
    }

    function flyingHearts(){
      const symbols = ["🫶🏻", "💖", "💗", "💘", "💕", "💞"];
      const count = 22;

      for(let i = 0; i < count; i++){
        const heart = document.createElement("div");
        heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        heart.className = "flyingHeart";

        const side = Math.floor(Math.random() * 4);
        let startX = 0;
        let startY = 0;
        let driftX = 0;
        let driftY = 0;

        if(side === 0){
          startX = Math.random() * window.innerWidth;
          startY = window.innerHeight + 40;
          driftX = -120 + Math.random() * 240;
          driftY = -(420 + Math.random() * 420);
        }else if(side === 1){
          startX = -30;
          startY = Math.random() * window.innerHeight;
          driftX = 220 + Math.random() * 360;
          driftY = -(80 + Math.random() * 260);
        }else if(side === 2){
          startX = window.innerWidth + 30;
          startY = Math.random() * window.innerHeight;
          driftX = -(220 + Math.random() * 360);
          driftY = -(80 + Math.random() * 260);
        }else{
          startX = Math.random() * window.innerWidth;
          startY = window.innerHeight * 0.88;
          driftX = -180 + Math.random() * 360;
          driftY = -(380 + Math.random() * 380);
        }

        const size = 18 + Math.random() * 26;
        const rotate = -40 + Math.random() * 80;
        const duration = 3600 + Math.random() * 2200;
        const delay = Math.random() * 1200;

        heart.style.left = startX + "px";
        heart.style.top = startY + "px";
        heart.style.fontSize = size + "px";
        heart.style.opacity = 0.75 + Math.random() * 0.25;
        heart.style.setProperty("--dx", driftX + "px");
        heart.style.setProperty("--dy", driftY + "px");
        heart.style.setProperty("--rot", rotate + "deg");
        heart.style.animation = `floatHeart ${duration}ms ease-in-out ${delay}ms forwards`;

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duration + delay);
      }
    }

    createSparkles();

    for(let i = 0; i < 28; i++){
      createFallingPetal();
    }

    setInterval(createFallingPetal, 380);
    setInterval(flyingHearts, 2200);

    document.querySelectorAll(".flower").forEach(flower => {
      flower.addEventListener("click", () => {
        flower.classList.add("pop");
        setTimeout(() => {
          flower.classList.remove("pop");
        }, 500);
      });
    });
  </script>
